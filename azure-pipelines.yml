trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: databricks_secrets

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'

- script: |
    pip install databricks-cli==0.205.0
    databricks auth login --host "$DATABRICKS_HOST" --token "$DATABRICKS_TOKEN"
    databricks workspace import RentalPipeline.py /Users/banu@virtualbuddy.in/RentalPipeline/RentalPipeline.py --language PYTHON --overwrite
  displayName: 'Deploy notebook to Databricks'
  env:
    DATABRICKS_HOST: $(databricks_host)
    DATABRICKS_TOKEN: $(databricks_token)
