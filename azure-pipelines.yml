trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: databricks_secrets

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'

- script: |
    pip install databricks-cli
    mkdir -p ~/.databricks
    echo '[DEFAULT]' > ~/.databricks/config
    echo "host = ${DATABRICKS_HOST}" >> ~/.databricks/config
    echo "token = ${DATABRICKS_TOKEN}" >> ~/.databricks/config
    cat ~/.databricks/config  # DEBUG: check content (remove later)
    databricks workspace import RENTALPIPELINE/RentalPipeline.py /Users/banu@virtualbuddy.in/RentalPipeline/RentalPipeline.py --language PYTHON --overwrite
  displayName: 'Deploy notebook to Databricks'
  env:
    DATABRICKS_HOST: $(databricks_host)
    DATABRICKS_TOKEN: $(databricks_token)
